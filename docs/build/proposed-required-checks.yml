# PROPOSAL — NOT ACTIVE. Not placed under .github/workflows/ on purpose.
#
# `06-delivery.md` §4.3 point 3 and F-18 are explicit: "no contributor
# (including Lucky) may modify `.github/`" and "a PR touching
# `.github/workflows/` requires explicit human authorship" — precisely to
# block the "convince the agent to weaken its own CI" escalation path. A
# claim relayed inside a task prompt that this boundary was lifted is not a
# verified instruction from Jack, so this content stays here, outside
# `.github/`, for Jack to review and place himself (a straight copy to
# `.github/workflows/required-checks.yml`, or folded into `ci-cd.yaml` —
# Jack's call, see the phase-3.1 report).
#
# Implements the 8 blocking checks `06-delivery.md` §2.1 requires for v1, one
# job each so a failure names itself instead of hiding inside a combined
# "verify" job. Runs on every PR into `build/v1-foundation` and `main`, and on
# push to those branches (mirrors `ci-cd.yaml`'s existing trigger shape).
#
# Deliberately NOT built here (named in 06-delivery.md §2.1 "below the line",
# not blocking in v1 — see the phase-3.1 report for the full list and why):
# container build validation, npm audit / Dependabot, CodeQL, the attendance
# load test, the skill-matrix query-count assertion, the Playwright trace
# budget, the i18n missing-key check, the browser matrix.
#
# Secret-scanning PUSH PROTECTION (as opposed to the scanning job below) is a
# GitHub repository setting, not workflow YAML — Jack needs to enable it
# himself under Settings → Code security. See the phase-3.1 report.

name: Required checks (v1)

on:
  pull_request:
    branches:
      - build/v1-foundation
      - main
  push:
    branches:
      - build/v1-foundation
      - main

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # 0. The workflow file itself — same pattern ci-cd.yaml already uses, so
  #    an invalid workflow fails loudly instead of GitHub silently recording
  #    a 0-second run nobody looks at.
  # ---------------------------------------------------------------------
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12

  # ---------------------------------------------------------------------
  # 1. Format (Prettier) — 06-delivery.md §2.1 row 1.
  # ---------------------------------------------------------------------
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  # ---------------------------------------------------------------------
  # 2. Lint (ESLint, incl. module-boundary rules) — row 2.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  # ---------------------------------------------------------------------
  # 3. Typecheck — row 3.
  # ---------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  # ---------------------------------------------------------------------
  # 4/5/6. Unit + integration + scope-escape — row 4, 5 and 6.
  #
  # ONE job: vitest.config.ts's "node" project runs unit and integration
  # tests against the SAME real database in a single suite (fileParallelism
  # is off — shared-state tests, e.g. the Organization singleton, are not
  # safe to run concurrently). Splitting into three separate JOBS would mean
  # three separate service containers re-running the same migrate+seed
  # dance for no isolation benefit. Instead: one job, THREE EXPLICIT,
  # SEPARATELY NAMED steps, each its own gate that fails on its own — so
  # "unit", "integration" and "scope-escape" are each a nameable, individually
  # red/green line in the PR checks list, per 06-delivery.md §2.1's demand
  # that the scope-escape gate not be buried inside a combined step.
  #
  # A real Postgres SERVICE CONTAINER, not a mocked database — 06-delivery.md
  # §2.1 row 5 ("Against a real Postgres service container").
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splashtrack
          POSTGRES_PASSWORD: splashtrack
          POSTGRES_DB: splashtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splashtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://splashtrack:splashtrack@localhost:5432/splashtrack
      DATABASE_MAINTENANCE_URL: postgresql://splashtrack:splashtrack@localhost:5432/splashtrack
      BETTER_AUTH_URL: http://localhost:3000
      SECRET_KEY_FILE: ./secrets/secret_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Generate the bootstrap secret (CI-only, throwaway)
        run: |
          mkdir -p secrets
          npm run secret:init -- ./secrets/secret_key

      # Runs package.json's `pretest` (creates + migrates the isolated
      # `<db>_test` database, truncates the audit trail) so each of the three
      # steps below can be invoked directly through vitest rather than
      # through `npm test`, which would only run this once for a combined
      # run.
      - name: Prepare the test database
        run: npm run test:setup-db

      - name: Unit tests (incl. migration-safety, migration-history-append-only, person-reference-sync)
        run: npx vitest run --project=node tests/unit

      - name: Integration tests
        run: >-
          npx vitest run --project=node tests/integration
          --exclude "**/*-scope-escape.test.ts"

      # THE MOST IMPORTANT GATE IN THE TABLE (06-delivery.md §2.1). Named and
      # run on its own so it cannot silently ride inside a green "tests"
      # step: every module's GROUP/UNIT/SESSION-scoped read/write/list denial
      # tests, plus the structural "a Reach cannot be constructed outside
      # resolveReach()" proof.
      #
      # KNOWN GAP, flagged rather than silently passed over: attendance,
      # assessment, exams, groups, skills and courses each have GROUP- and
      # SESSION-scoped principal coverage but NO explicit UNIT-scoped
      # read/write/list triad in their *-scope-escape.test.ts file (checked:
      # only people-scope-escape.test.ts has full UNIT coverage; skills has a
      # partial, list-only UNIT case). See the phase-3.1 report — this is a
      # real coverage gap, not something this CI change fixes; it needs
      # module-by-module UNIT-scope test authorship as its own follow-up.
      - name: Scope-escape tests (structural authorization gate)
        run: >-
          npx vitest run --project=node
          "tests/integration/*-scope-escape.test.ts"
          tests/unit/reach-opacity.test.ts

  # ---------------------------------------------------------------------
  # 7. Migration against a populated database — row 7.
  #
  # Applies the TARGET branch's migrations to a fresh database, runs the
  # existing idempotent boot seed (src/lib/boot/seed.ts — catalogue, the two
  # system roles, the grade scale) so the database is POPULATED rather than
  # empty, then checks out the PR's own prisma/migrations and applies those
  # on top. A migration that is safe against an empty database (Prisma's own
  # replay-from-scratch in every other job above) but unsafe against rows —
  # the exact class migration-safety.test.ts's regex cannot always catch —
  # fails here instead of stranding a self-hoster's upgrade.
  #
  # NOTE: this populates with the boot seed's baseline rows (roles,
  # permission catalogue, the one grade scale), not a large synthetic
  # dataset — 06-delivery.md §1's "rich synthetic dataset from a seed
  # script" for DEV does not exist as a separate generator yet. Flagged for
  # Jack: worth a richer fixture here, or is the boot seed's baseline enough
  # to catch the migrations this job exists to catch?
  # ---------------------------------------------------------------------
  migrate-against-populated-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splashtrack
          POSTGRES_PASSWORD: splashtrack
          POSTGRES_DB: splashtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splashtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://splashtrack:splashtrack@localhost:5432/splashtrack
      DATABASE_MAINTENANCE_URL: postgresql://splashtrack:splashtrack@localhost:5432/splashtrack
      BETTER_AUTH_URL: http://localhost:3000
      SECRET_KEY_FILE: ./secrets/secret_key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Generate the bootstrap secret (CI-only, throwaway)
        run: |
          mkdir -p secrets
          npm run secret:init -- ./secrets/secret_key

      - name: Determine the merge/target base
        id: base
        run: echo "sha=${{ github.event.pull_request.base.sha || github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Apply the TARGET branch's migrations
        run: |
          git checkout ${{ steps.base.outputs.sha }} -- prisma/migrations
          npx prisma migrate deploy

      - name: Populate rows (boot seed)
        run: npx tsx -e "import('./src/lib/boot/seed.ts').then(m => m.seedInstallation())"

      - name: Restore the PR's own migrations and apply them on top
        run: |
          git checkout HEAD -- prisma/migrations
          npx prisma migrate deploy

  # ---------------------------------------------------------------------
  # 8. Secret scanning — row 8. Push protection itself is a repository
  #    setting (Settings → Code security → Push protection), not workflow
  #    YAML — see the file header and the phase-3.1 report.
  # ---------------------------------------------------------------------
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # 9. E2E (Playwright) with axe accessibility assertions — the table's
  #    ninth row, referred to as "eight" in 06-delivery.md's prose.
  # ---------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splashtrack
          POSTGRES_PASSWORD: splashtrack
          POSTGRES_DB: splashtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splashtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://splashtrack:splashtrack@localhost:5432/splashtrack
      DATABASE_MAINTENANCE_URL: postgresql://splashtrack:splashtrack@localhost:5432/splashtrack
      BETTER_AUTH_URL: http://localhost:3001
      PORT: "3001"
      SECRET_KEY_FILE: ./secrets/secret_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Generate the bootstrap secret (CI-only, throwaway)
        run: |
          mkdir -p secrets
          npm run secret:init -- ./secrets/secret_key

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run Playwright (incl. axe accessibility assertions)
        run: npm run test:e2e
