# The `web` service is removed until the v1 application exists.
# It pointed at the deleted prototype (apps/web, removed under D-174/OD-1) and
# would have been rebuilt wrong: the v1 app lives at the repository root, its
# environment surface is governed by D-037, and DATABASE_URL must not be a
# hardcoded default. It is re-added in phase 0.2 alongside the real Dockerfile.
#
# `docker compose up postgres` is what this file is for today: a local database
# to develop against.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: splashtrack
      POSTGRES_USER: splashtrack
      POSTGRES_PASSWORD: splashtrack
    ports:
      - '5432:5432'
    volumes:
      - splashtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U splashtrack -d splashtrack']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splashtrack-postgres-data:
